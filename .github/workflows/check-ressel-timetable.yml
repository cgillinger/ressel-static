# Synkar data/ mot Ressels webbtabeller (ressel.se/emelie-trafiken/ och /sjostadstrafiken/)
# varje vecka med tools/sync_ressel.py. Nya perioder och tysta ändringar i befintliga tider
# ger en pull request (gren auto/ressel-sync-<datum>). Aldrig auto-merge: en människa
# granskar sammanfattningen (särskilt varningar) innan merge. Finns redan en öppen PR med
# prefixet auto/ressel-sync- skapas ingen ny (undviker PR-spam), körningen loggar bara.
#
# Kräver att repot tillåter "Actions får skapa pull requests"
# (Settings > Actions > General > Workflow permissions).
# PR:er som öppnas med GITHUB_TOKEN triggar inte andra workflows; validering och
# tester körs därför här i jobbet och redovisas i PR-texten.
name: Synka Ressel-tidtabeller

on:
  schedule:
    - cron: '0 6 * * 1'   # måndagar 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checka ut main
        uses: actions/checkout@v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Installera poppler-utils
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Synka mot ressel.se
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Hämtar webbsidorna och PDF-länkarna live. Exit 1 = tolkningsfel; ändringar
          # som ändå gick att skriva tas med i PR:en, men jobbet markeras som misslyckat.
          sync_status=0
          python3 tools/sync_ressel.py --write > sync.txt 2>&1 || sync_status=$?
          cat sync.txt

          if [ -z "$(git status --porcelain data)" ]; then
            echo "Inga dataändringar."
            exit $sync_status
          fi

          open=$(gh pr list --state open --json headRefName --jq '.[].headRefName' | grep '^auto/ressel-sync-' || true)
          if [ -n "$open" ]; then
            echo "Det finns redan en öppen synk-PR ($open); skapar ingen ny. Ändringarna ligger kvar i arbetskopian och förloras."
            exit $sync_status
          fi

          branch="auto/ressel-sync-$(date -u +%F)"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "Grenen $branch finns redan; skapar ingen ny PR."
            exit $sync_status
          fi

          python3 tools/validate.py > validate.txt 2>&1 || true
          python3 -m unittest > tests.txt 2>&1 && tests_status="OK" || tests_status="MISSLYCKADES"

          git checkout -q -b "$branch"
          git add data
          git commit -q -m "data: synka mot Ressels webbtabeller"
          git push -q origin "$branch"

          {
            echo "Automatisk synk mot ressel.se (\`tools/sync_ressel.py\`)."
            echo
            echo "**Granska innan merge.** Kontrollera ändrade tider och varningar nedan mot ressel.se och PDF:erna. Mergas aldrig automatiskt."
            echo
            echo "### Sammanfattning"
            echo '```'; cat sync.txt; echo '```'
            echo
            echo "### Validator"
            echo '```'; cat validate.txt; echo '```'
            echo
            echo "### Enhetstester: $tests_status"
          } > body.md

          gh pr create --base main --head "$branch" \
            --title "Ressel-synk $(date -u +%F)" --body-file body.md
          exit $sync_status
